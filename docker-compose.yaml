services:
  database:
    image: 'mysql:8'
    container_name: "dbSystem"
    restart: "always"
    environment:
      - 'MYSQL_DATABASE=systemJC'
      - 'MYSQL_PASSWORD=123456789'
      - 'MYSQL_ROOT_PASSWORD=root'
      - 'MYSQL_USER=root'
    ports:
      - '3306'
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: backend-system-jc
    restart: "always"
    ports:
      - '8080:8080'
    depends_on:
      - database
    environment:
      DB_URL: jdbc:mysql://database:3306/systemJC
      DB_USER: root
      DB_PASS: root

  frontend:
    build: ./frontend
    container_name: front-system-jc
    restart: "always"
    ports:
      - '3000:3000'
    depends_on:
      - backend
  
volumes:
  db_data: